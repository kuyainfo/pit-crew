<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>極速維修站｜投影</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
#fs{position:fixed;right:10px;bottom:10px;z-index:5;font:13px sans-serif;color:#fff;background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;opacity:.5}
#fs:hover{opacity:1}
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<button id="fs">全螢幕</button>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="core.js"></script>
<script>
(async function () {
  const W = 1920, H = 1080, cv = document.getElementById('cv'), c = cv.getContext('2d');
  function fit() { const k = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; }
  addEventListener('resize', fit); fit();
  document.getElementById('fs').onclick = () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || (() => { })).call(d); };

  const db = await GS.ready();
  const P = s => GS.ROOT + '/' + s;
  const { clamp, rgba, shade, toArr, TAU, rr } = GS;
  const ORB = 'Orbitron, "Noto Sans TC", sans-serif', TC = '"Noto Sans TC", "Microsoft JhengHei", sans-serif';
  const YEL = '#ffd60a', RED = '#ff2d55', GRN = '#2dff8a';

  /* ───── 資料 ───── */
  let game = {}, cfg = GS.cfgOf(null), round = 0, stat = null, resAll = {}, players = {}, logoImg = null, stKey = '';
  const subs = {};
  function resub(k, fn) { if (subs[k]) subs[k](); subs[k] = fn ? fn() : null; }
  let lastStatus = '', statusAt = performance.now(), disp = [], lastStart = 0;
  db.on(P('game'), g => {
    game = g || {}; cfg = GS.cfgOf(game);
    const r = game.round || 1;
    if (r !== round) { round = r; resub('res', () => db.on(P('res/' + r), v => { resAll = v || {}; })); }
    const s = game.stage == null ? -1 : game.stage, key = r + '_' + s;
    if (key !== stKey) { stKey = key; stat = null; disp = []; sparks = []; if (s >= 0) resub('stat', () => db.on(P('stat/' + r + '/' + s), v => { stat = v; })); else resub('stat', null); }
    if ((game.startAt || 0) !== lastStart) { lastStart = game.startAt || 0; disp = []; sparks = []; }   // 重玩本關：畫面歸零
    const st = (game.status || 'lobby') + '_' + s;
    if (st !== lastStatus) { lastStatus = st; statusAt = performance.now(); if (game.status === 'podium') { confetti = []; } }
  });
  db.on(P('players'), v => { players = v || {}; });
  db.on(P('logo'), v => { if (!v) { logoImg = null; return; } const im = new Image(); im.onload = () => { logoImg = im; }; im.src = v; });

  /* ───── QR code ───── */
  const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
  const playerUrl = base + 'index.html?' + (GS.LOCAL_MODE && /local=1/.test(location.search) ? 'local=1&' : '') + 'openExternalBrowser=1';
  let qrCv = null;
  try {
    const q = qrcode(0, 'M'); q.addData(playerUrl); q.make();
    const n = q.getModuleCount(), cell = Math.floor(360 / (n + 8)), size = cell * (n + 8);
    qrCv = document.createElement('canvas'); qrCv.width = qrCv.height = size;
    const qc = qrCv.getContext('2d'); qc.fillStyle = '#fff'; qc.fillRect(0, 0, size, size); qc.fillStyle = '#000';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) qc.fillRect((x + 4) * cell, (y + 4) * cell, cell, cell);
  } catch (e) { qrCv = null; }

  /* ───── 繪圖工具 ───── */
  function T(str, x, y, size, col, align, weight, font, base) {
    c.font = `${weight || 900} ${size}px ${font || TC}`; c.fillStyle = col || '#fff';
    c.textAlign = align || 'left'; c.textBaseline = base || 'middle'; c.fillText(str, x, y);
  }
  function TW(str, size, weight, font) { c.font = `${weight || 900} ${size}px ${font || TC}`; return c.measureText(str).width; }
  const now = () => db.now();
  const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const back = t => { t = clamp(t, 0, 1); const s = 1.7; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };

  /* 背景（預先畫好） */
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  (function () {
    const b = bg.getContext('2d');
    const g = b.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#16131f'); g.addColorStop(1, '#07060b'); b.fillStyle = g; b.fillRect(0, 0, W, H);
    b.strokeStyle = 'rgba(255,255,255,.035)'; b.lineWidth = 2;
    for (let x = 0; x < W; x += 80) { b.beginPath(); b.moveTo(x, 0); b.lineTo(x, H); b.stroke(); }
    for (let y = 0; y < H; y += 80) { b.beginPath(); b.moveTo(0, y); b.lineTo(W, y); b.stroke(); }
    const v = b.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1200); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)'); b.fillStyle = v; b.fillRect(0, 0, W, H);
  })();
  function hazard(y, h) {
    c.save(); c.beginPath(); c.rect(0, y, W, h); c.clip();
    c.fillStyle = '#111'; c.fillRect(0, y, W, h); c.fillStyle = YEL;
    for (let x = -h; x < W + h; x += h * 2) { c.beginPath(); c.moveTo(x, y + h); c.lineTo(x + h, y); c.lineTo(x + h * 2, y); c.lineTo(x + h, y + h); c.fill(); }
    c.restore();
  }

  function chevron(x, y, sz, col) {
    c.strokeStyle = col; c.lineWidth = sz * 0.35; c.lineJoin = 'round'; c.lineCap = 'round';
    for (let q = 0; q < 2; q++) { c.beginPath(); c.moveTo(x - sz, y + q * sz * 0.8 + sz * 0.5); c.lineTo(x, y + q * sz * 0.8 - sz * 0.4); c.lineTo(x + sz, y + q * sz * 0.8 + sz * 0.5); c.stroke(); }
    c.lineCap = 'butt';
  }
  /* ───── 粒子 ───── */
  let sparks = [], confetti = [];
  function spark(x, y, col, n, spd) {
    for (let k = 0; k < n; k++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2; const v = (spd || 6) * (0.5 + Math.random()); sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, col: col || YEL }); }
    if (sparks.length > 500) sparks.splice(0, sparks.length - 500);
  }
  function drawSparks(dt) {
    for (const p of sparks) { p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.35 * dt * 60; p.l -= dt * 1.6; }
    sparks = sparks.filter(p => p.l > 0);
    for (const p of sparks) { c.globalAlpha = clamp(p.l, 0, 1); c.fillStyle = p.col; c.fillRect(p.x - 2, p.y - 2, 4, 4); }
    c.globalAlpha = 1;
  }

  /* ───── 全螢幕閃光 ───── */
  let flash = { a: 0, col: '#ffffff' };
  function doFlash(col, a) { flash = { a: a || 0.6, col }; }
  function drawFlash(dt) { if (flash.a <= 0) return; c.fillStyle = rgba(flash.col, clamp(flash.a, 0, 1)); c.fillRect(0, 0, W, H); flash.a -= dt * 1.6; }
  let fxGo = 0, fxGreen = 0, fxLand = 0;

  /* ───── 標頭 ───── */
  const HH = 118;
  function drawHeader(s, t) {
    c.fillStyle = 'rgba(8,7,12,.92)'; c.fillRect(0, 0, W, HH); hazard(HH, 10);
    if (logoImg) { const k = Math.min(260 / logoImg.width, 84 / logoImg.height); c.drawImage(logoImg, 40, HH / 2 - logoImg.height * k / 2, logoImg.width * k, logoImg.height * k); }
    else { T(cfg.brand, 40, 40, 24, YEL, 'left', 900, ORB); T(cfg.title, 40, 82, 38, '#fff', 'left', 900); }
    const cx = W / 2, gap = 170;
    GS.STAGES.forEach((S, i) => {
      const x = cx + (i - 1.5) * gap, on = i === s, done = !!resAll[i];
      if (i < 3) { c.strokeStyle = done ? YEL : 'rgba(255,255,255,.2)'; c.lineWidth = 4; c.beginPath(); c.moveTo(x + 32, 46); c.lineTo(x + gap - 32, 46); c.stroke(); }
      c.fillStyle = on ? YEL : done ? '#3a3220' : '#1d1b26'; c.strokeStyle = on ? '#fff' : done ? YEL : 'rgba(255,255,255,.25)'; c.lineWidth = 3;
      c.beginPath(); c.arc(x, 46, on ? 30 : 24, 0, TAU); c.fill(); c.stroke();
      T(String(i + 1), x, 48, on ? 28 : 22, on ? '#1a1200' : done ? YEL : '#aaa', 'center', 900, ORB);
      T(S.name, x, 97, on ? 26 : 20, on ? '#fff' : done ? '#e9d79a' : '#8a8798', 'center', on ? 900 : 700);
    });
    if (t) t();
  }

  /* ───── 單一維修車格 ───── */
  const PB = { x: 360, w: 960 };   // 維修框位置
  function rowGeom(i, n) {
    const top = HH + 22, bottom = 1068, gap = n > 5 ? 8 : 12, h = (bottom - top - gap * (n - 1)) / n;
    return { y: top + i * (h + gap), h };
  }
  function stageRank(st, i) {
    const t = toArr(st && st.t); const d = t[i] && t[i].d; if (!d) return 0;
    return 1 + t.filter((x, k) => k !== i && x && x.d && x.d < d).length;
  }
  function tireChip(x, y, r, state, col, pop) {
    const sc = 1 + 0.55 * pop;
    c.save(); c.translate(x, y); c.scale(sc, sc);
    c.fillStyle = state === 'done' ? '#0b0b0f' : '#25242d'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = state === 'done' ? col : state === 'cur' ? YEL : '#4a4955'; c.lineWidth = r * 0.2; c.beginPath(); c.arc(0, 0, r * 0.62, 0, TAU); c.stroke();
    if (state === 'done') { c.strokeStyle = '#fff'; c.lineWidth = r * 0.18; c.lineCap = 'round'; c.beginPath(); c.moveTo(-r * 0.32, 0); c.lineTo(-r * 0.06, r * 0.26); c.lineTo(r * 0.36, -r * 0.24); c.stroke(); c.lineCap = 'butt'; }
    if (state === 'cur') { c.strokeStyle = rgba(YEL, 0.5 + 0.5 * Math.sin(performance.now() / 90)); c.lineWidth = 4; c.beginPath(); c.arc(0, 0, r + 7, 0, TAU); c.stroke(); }
    c.restore();
  }
  function drawRow(i, n, s, ph, nowT, dt) {
    const team = GS.team(cfg, i), { y, h } = rowGeom(i, n), col = team.c;
    const st = toArr(stat && stat.t)[i] || { p: 0, v: 0, n: 0 };
    const D = disp[i] || (disp[i] = { p: 0, v: 0, act: 0, lastP: 0, lastV: 0, x: 0, tk: 0, pop: [0, 0, 0, 0] });
    const tp = st.p || 0, tv = st.v || 0;
    D.p += (tp - D.p) * clamp(dt * 6, 0, 1); D.v += (tv - D.v) * clamp(dt * 6, 0, 1);
    const rate = s < 3 ? Math.max(0, D.p - D.lastP) / Math.max(dt, 1e-3) : Math.max(0, D.v - D.lastV) / Math.max(dt, 1e-3);
    D.act += ((s < 3 ? rate * 12 : rate / 6) - D.act) * clamp(dt * 4, 0, 1); D.act = clamp(D.act, 0, 1.5);
    D.lastP = D.p; D.lastV = D.v;
    const done = s < 3 && !!st.d, tn = performance.now();
    /* 格子背景 */
    c.fillStyle = '#121019'; rr(c, 24, y, W - 48, h, 14); c.fill();
    const fg = c.createLinearGradient(0, y, 0, y + h); fg.addColorStop(0, 'rgba(255,255,255,.02)'); fg.addColorStop(1, rgba(col, done ? 0.22 : 0.12)); c.fillStyle = fg; rr(c, 24, y, W - 48, h, 14); c.fill();
    c.fillStyle = col; rr(c, 24, y, 16, h, 8); c.fill();
    const ground = y + h - 20, k = clamp((h - 40) / 152, 0.42, 1.25);
    /* 維修框 */
    if (s < 3) {
      c.fillStyle = 'rgba(0,0,0,.18)'; rr(c, PB.x, y + 10, PB.w, h - 20, 8); c.fill();
      c.setLineDash([20, 12]); c.strokeStyle = rgba(YEL, 0.45); c.lineWidth = 3; rr(c, PB.x, y + 10, PB.w, h - 20, 8); c.stroke(); c.setLineDash([]);
      if (s !== 2) T('PIT ' + (i + 1), PB.x + 18, y + 32, 18, 'rgba(255,255,255,.18)', 'left', 900, ORB);
    }
    c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 2; c.beginPath(); c.moveTo(PB.x, ground + 2); c.lineTo(PB.x + PB.w, ground + 2); c.stroke();
    /* 左側隊名 */
    const nameSize = clamp(h * 0.24, 24, 56);
    T(team.n, 64, y + h * 0.42, nameSize, '#fff', 'left', 900);
    T(`${st.n || aliveCnt[i] || 0} 人`, 64, y + h * 0.42 + nameSize * 0.9, clamp(h * 0.11, 14, 24), '#a9a6b8', 'left', 700);
    /* 車子 */
    let cx = PB.x + PB.w * 0.42, lift = 0, opt = { num: i + 1 }, work = null, nozzle = null;
    const LIFT = 36;
    if (s === 0) {
      lift = LIFT * ease(D.p);
      const top = ground - (lift + 22) * k;
      c.fillStyle = '#2b2a33'; rr(c, cx - 80 * k, ground - 14 * k, 150 * k, 14 * k, 4 * k); c.fill();
      c.fillStyle = YEL; c.fillRect(cx - 12 * k, top, 22 * k, ground - 14 * k - top);
      c.fillStyle = '#e0b400'; c.fillRect(cx - 30 * k, top - 6 * k, 60 * k, 8 * k);
      if (D.act > 0.1 && !done) {
        const ph2 = (tn / 400) % 1;
        c.globalAlpha = clamp(D.act, 0, 1) * (1 - ph2);
        for (const ax of [cx - 245 * k, cx + 250 * k]) chevron(ax, ground - (40 + ph2 * 60) * k, 22 * k, YEL);
        c.globalAlpha = 1;
      }
      opt.rear = 'old'; opt.front = 'old';
    } else if (s === 1) {
      lift = LIFT;
      const kDone = Math.min(4, Math.floor(D.p * 4 + 1e-6)), cur = done ? -1 : kDone;
      opt.rear = (cur === 0 || cur === 2) ? 'off' : (kDone >= 1 ? 'new' : 'old');
      opt.front = (cur === 1 || cur === 3) ? 'off' : (kDone >= 2 ? 'new' : 'old');
      if (kDone >= 3 && cur !== 2) opt.rear = 'new'; if (kDone >= 4) opt.front = 'new';
      const top = ground - (lift + 22) * k;
      c.fillStyle = '#2b2a33'; rr(c, cx - 80 * k, ground - 14 * k, 150 * k, 14 * k, 4 * k); c.fill();
      c.fillStyle = YEL; c.fillRect(cx - 12 * k, top, 22 * k, ground - 14 * k - top);
      if (cur >= 0) {
        const isRear = cur === 0 || cur === 2, wx = cx + (isRear ? -95 : 98) * k, wy = ground - (lift + 34) * k;
        const frac = D.p * 4 - kDone, off = (1 - Math.abs(frac * 2 - 1)) * 40 * k;
        work = { x: wx + (isRear ? -off : off), y: wy + off * 0.5, kind: frac < 0.5 ? 'old' : 'new' };
      }
      /* 4 顆輪胎指示（2×2，換好一顆會彈一下＋火花） */
      const r = clamp(h * 0.12, 14, 28), gx0 = PB.x + PB.w - 175, gy0 = y + h * 0.33;
      if (kDone > D.tk) { for (let q = D.tk; q < kDone && q < 4; q++) { D.pop[q] = tn; const px = gx0 + (q % 2) * (r * 2.7), py = gy0 + Math.floor(q / 2) * (h * 0.36); for (let z = 0; z < 16; z++) spark(px, py, z % 2 ? col : YEL, 1, 7); } D.tk = kDone; }
      for (let q = 0; q < 4; q++) {
        const px = gx0 + (q % 2) * (r * 2.7), py = gy0 + Math.floor(q / 2) * (h * 0.36);
        const pop = D.pop[q] ? Math.max(0, 1 - (tn - D.pop[q]) / 450) : 0;
        tireChip(px, py, r, q < kDone ? 'done' : q === cur ? 'cur' : 'todo', col, pop);
      }
      T('TIRES', gx0 + r * 1.35, y + h - 26, 14, '#8c8999', 'center', 700, ORB);
    } else if (s === 2) {
      const rigX = PB.x + 70, rigTop = y + 16, nx = cx - 40 * k, ny = ground - 62 * k;
      c.fillStyle = '#24232c'; rr(c, rigX - 18, rigTop, 36, ground - rigTop, 6); c.fill();
      c.fillStyle = YEL; rr(c, rigX - 30, rigTop, 60, 28, 6); c.fill();
      T('FUEL', rigX, rigTop + 15, 14, '#111', 'center', 900, ORB);
      const hx0 = rigX + 18, hy0 = rigTop + 44, mx1 = hx0 + 80, my1 = ny + 40 * k, mx2 = nx - 90 * k, my2 = ny - 70 * k;
      c.lineCap = 'round';
      c.strokeStyle = '#0d0d12'; c.lineWidth = 13 * k + 2; c.beginPath(); c.moveTo(hx0, hy0); c.bezierCurveTo(mx1, my1, mx2, my2, nx, ny); c.stroke();
      c.strokeStyle = '#45444f'; c.lineWidth = 8 * k; c.stroke(); c.lineCap = 'butt';
      if (D.act > 0.05 && !done) {
        const tt = tn / 1000;
        for (let q = 0; q < 8; q++) {
          const u = ((tt * 1.3 + q / 8) % 1), w0 = (1 - u) ** 3, w1 = 3 * (1 - u) ** 2 * u, w2 = 3 * (1 - u) * u * u, w3 = u ** 3;
          c.fillStyle = rgba(YEL, clamp(D.act, 0, 1)); c.beginPath(); c.arc(w0 * hx0 + w1 * mx1 + w2 * mx2 + w3 * nx, w0 * hy0 + w1 * my1 + w2 * my2 + w3 * ny, 5 * k, 0, TAU); c.fill();
        }
      }
      nozzle = { x: nx, y: ny };
      const gw = 62, gx = PB.x + PB.w - 120, gy = y + 18, gh = h - 46;
      c.fillStyle = '#0b0a10'; rr(c, gx, gy, gw, gh, 10); c.fill();
      const fh = (gh - 8) * D.p;
      const lg = c.createLinearGradient(0, gy + gh, 0, gy); lg.addColorStop(0, shade(col, -0.2)); lg.addColorStop(1, shade(col, 0.25));
      c.fillStyle = lg; rr(c, gx + 4, gy + gh - 4 - fh, gw - 8, Math.max(0, fh), 7); c.fill();
      if (fh > 10) { c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(gx + 8, gy + gh - 4 - fh + 3 + Math.sin(tn / 150) * 2, gw - 16, 3); }
      c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 2; rr(c, gx, gy, gw, gh, 10); c.stroke();
      for (let q = 1; q < 4; q++) { c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(gx + gw - 14, gy + gh * q / 4, 10, 2); }
      T('FUEL', gx + gw / 2, y + h - 18, 14, '#8c8999', 'center', 700, ORB);
      opt.rear = 'new'; opt.front = 'new';
    } else if (s === 3) {
      const gA = game.greenAt || Infinity, f = clamp((nowT - gA) / (cfg.win4 * 1000), 0, 1);
      const vLead = Math.max(0.01, ...toArr(stat && stat.t).map(x => (x && x.v) || 0));
      const x0 = PB.x + 150, x1 = 1420;
      const target = nowT < gA ? x0 : x0 + (x1 - x0) * f * clamp(D.v / vLead, 0, 1);
      D.x = D.x ? D.x + (target - D.x) * clamp(dt * 5, 0, 1) : x0;
      cx = D.x; opt.flame = nowT >= gA ? clamp(D.act, 0, 1) : 0; opt.spin = (D.x - x0) / (34 * k); opt.rear = 'new'; opt.front = 'new';
      c.fillStyle = 'rgba(255,255,255,.1)'; c.fillRect(x0 - 175 * k, y + 14, 6, h - 28);
      for (let q = 0; q < 8; q++) { c.fillStyle = q % 2 ? '#111' : '#fff'; c.fillRect(1500, y + 12 + q * (h - 24) / 8, 14, (h - 24) / 8); }
      T('EXIT', 1530, y + 28, 16, '#8c8999', 'left', 900, ORB);
    }
    if (s !== 3) opt.spin = 0;
    GS.drawCar(c, cx, ground, k, col, Object.assign(opt, { lift }));
    if (nozzle) { c.fillStyle = '#16151c'; rr(c, nozzle.x - 14 * k, nozzle.y - 10 * k, 30 * k, 20 * k, 5 * k); c.fill(); c.fillStyle = YEL; c.fillRect(nozzle.x - 4 * k, nozzle.y - 14 * k, 8 * k, 6 * k); }
    if (work) {
      GS.wheel(c, work.x, work.y, 34 * k, work.kind, (tn / 1000) * (D.act > 0.1 ? 40 : 2), col);
      c.fillStyle = '#2b2a33'; rr(c, work.x - 8 * k, work.y - 70 * k, 16 * k, 46 * k, 4 * k); c.fill();
      c.fillStyle = YEL; rr(c, work.x - 12 * k, work.y - 88 * k, 24 * k, 22 * k, 5 * k); c.fill();
      if (D.act > 0.2 && Math.random() < 0.5) spark(work.x, work.y - 20 * k, Math.random() < 0.5 ? YEL : '#fff', 1, 3.5);
    }
    /* POWER 出力表（橫條，貼著維修框右邊） */
    if (s < 2 && !done) {
      const mx = PB.x + PB.w + 26, mw = 200, my = y + h / 2 - 2, lit = Math.round(clamp(D.act / 2, 0, 1) * 10);
      T('POWER', mx, my - 30, 16, '#8c8999', 'left', 900, ORB);
      for (let q = 0; q < 10; q++) {
        c.fillStyle = q < lit ? (q >= 8 ? RED : q >= 5 ? YEL : GRN) : 'rgba(255,255,255,.07)';
        c.fillRect(mx + q * (mw / 10), my - 14, mw / 10 - 4, 34);
      }
    }

        const sg = c.createLinearGradient(0, 140, 0, by); sg.addColorStop(0, 'rgba(255,240,180,.05)'); sg.addColorStop(1, 'rgba(255,240,180,.32)');
        c.fillStyle = sg; c.beginPath(); c.moveTo(sl.x - 40, 140); c.lineTo(sl.x + 40, 140); c.lineTo(sl.x + 230, by); c.lineTo(sl.x - 230, by); c.fill(); c.restore();
        const qs = 1 + 0.08 * Math.sin(t * 6);
        c.save(); c.translate(sl.x, by - 130); c.scale(qs, qs); T('?', 0, 0, 200, 'rgba(255,255,255,.85)', 'center', 900, ORB); c.restore();
        return;
      }
      if (a <= 0) return;
      c.save(); c.globalAlpha = a;
      const dropT = clamp((t - sl.at) * 1.6, 0, 1), drop = (1 - back(dropT)) * -300;
      GS.drawCar(c, sl.x, by + drop, sl.r === 1 ? 1.15 : 0.95, tm.c, { num: sl.r, rear: 'new', front: 'new' });
      T(tm.n, sl.x, by + (sl.r === 1 ? 135 : 115), sl.r === 1 ? 72 : 54, '#111', 'center', 900);
      T(o.pts + ' 分', sl.x, by + (sl.r === 1 ? 215 : 175), sl.r === 1 ? 48 : 38, 'rgba(0,0,0,.7)', 'center', 900, ORB);
      c.restore();
      if (sl.r === 1 && dropT >= 1 && fxLand !== statusAt) {
        fxLand = statusAt; doFlash('#ffffff', 0.55);
        for (let q = 0; q < 140; q++) { const L = q % 2 === 0; confetti.push({ x: L ? 0 : W, y: floor - 40, vx: (L ? 1 : -1) * (6 + Math.random() * 10), vy: -(12 + Math.random() * 12), g: 0.35, r: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.4, col: [YEL, RED, '#19e3ff', '#fff', tm.c][q % 5] }); }
      }
      if (sl.r === 1 && t > sl.at + 0.6) {
        const ta = ease((t - sl.at - 0.6) * 2), ty = by - 230 - Math.sin(t * 2) * 8;
        c.save(); c.globalAlpha = ta; drawTrophy(sl.x, ty, 0.95); c.restore();
        T('CHAMPION', W / 2, 140, 120 * (0.9 + 0.1 * ta), YEL, 'center', 900, ORB);
        if (confetti.length < 400 && Math.random() < 0.9) for (let q = 0; q < 4; q++) confetti.push({ x: Math.random() * W, y: -20, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, g: 0, r: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.3, col: [YEL, RED, '#19e3ff', '#fff', tm.c][q % 5] });
      }
    });
    for (const p of confetti) { p.vy += (p.g || 0) * dt * 60; if (p.g && p.vy > 4) { p.vy = 4; p.vx *= 0.98; } p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.r += p.vr; }
    confetti = confetti.filter(p => p.y < H + 20 && p.x > -40 && p.x < W + 40);
    for (const p of confetti) { c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.col; c.fillRect(-7, -4, 14, 8); c.restore(); }
  }
  function drawTrophy(x, y, s) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.shadowColor = 'rgba(255,214,10,.8)'; c.shadowBlur = 40;
    const g = c.createLinearGradient(-60, 0, 60, 0); g.addColorStop(0, '#b8860b'); g.addColorStop(0.5, '#ffe680'); g.addColorStop(1, '#b8860b');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-60, -90); c.lineTo(60, -90); c.quadraticCurveTo(60, 10, 0, 20); c.quadraticCurveTo(-60, 10, -60, -90); c.fill();
    c.shadowBlur = 0; c.strokeStyle = '#e0b400'; c.lineWidth = 10;
    c.beginPath(); c.arc(-62, -55, 26, Math.PI * 0.5, Math.PI * 1.5); c.stroke(); c.beginPath(); c.arc(62, -55, 26, -Math.PI * 0.5, Math.PI * 0.5); c.stroke();
    c.fillStyle = g; c.fillRect(-12, 18, 24, 40); c.fillRect(-50, 56, 100, 22);
    c.restore();
  }

  /* ───── 大廳 ───── */
  const lob = { prev: [], bump: [] };
  function drawLobby(t) {
    const n = cfg.teams.length, nowT = now(), cnt = countAlive(nowT), tn = performance.now();
    hazard(0, 16);
    let ty = 120;
    if (logoImg) { const k = Math.min(360 / logoImg.width, 110 / logoImg.height); c.drawImage(logoImg, 90, 50, logoImg.width * k, logoImg.height * k); ty = 200; }
    T(cfg.brand, 96, ty, 36, YEL, 'left', 900, ORB);
    T(cfg.title, 88, ty + 100, 140, '#fff', 'left', 900);
    T('全隊合力・最快進站', 96, ty + 200, 42, '#cfc9dc', 'left', 700);
    const steps = ['掃描 QR code', '輸入名字、選桌號', '按「啟用感應」，上下甩 3 下測試'];
    steps.forEach((s, k) => { const yy = ty + 290 + k * 70; c.fillStyle = YEL; c.beginPath(); c.arc(124, yy, 26, 0, TAU); c.fill(); T(String(k + 1), 124, yy + 2, 30, '#111', 'center', 900, ORB); T(s, 170, yy, 38, '#fff', 'left', 700); });
    T('⚠ 搖的時候握緊手機，小心不要甩出去', 96, ty + 520, 32, '#ffb4c2', 'left', 700);
    const qx = 1400, qy = 70, qs = 400;
    c.fillStyle = '#fff'; rr(c, qx - 20, qy - 20, qs + 40, qs + 40, 24); c.fill();
    if (qrCv) c.drawImage(qrCv, qx, qy, qs, qs); else { T('QR code 載入失敗', qx + qs / 2, qy + qs / 2 - 20, 30, '#111', 'center'); T(playerUrl.slice(0, 40), qx + qs / 2, qy + qs / 2 + 30, 18, '#333', 'center', 500); }
    T('掃我加入維修隊', qx + qs / 2, qy + qs + 64, 42, '#fff', 'center', 900);
    /* 隊伍車庫：車子停著、怠速抖動＋排氣；有人加入人數會跳 */
    const gap = 22, cw = (W - 180 - (n - 1) * gap) / n, y0 = 700, chh = 350;
    cfg.teams.forEach((tm, i) => {
      if (lob.prev[i] != null && cnt[i] > lob.prev[i]) lob.bump[i] = tn;
      lob.prev[i] = cnt[i];
      const x = 90 + i * (cw + gap);
      c.fillStyle = 'rgba(255,255,255,.05)'; rr(c, x, y0, cw, chh, 20); c.fill();
      c.fillStyle = tm.c; rr(c, x, y0, cw, 14, 7); c.fill();
      const g = c.createLinearGradient(0, y0, 0, y0 + chh); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, rgba(tm.c, 0.14)); c.fillStyle = g; rr(c, x, y0, cw, chh, 20); c.fill();
      const k = Math.min(0.95, (cw - 40) / 340), gy = y0 + 210, cx = x + cw / 2;
      const jig = Math.sin(tn / 28 + i * 1.7) * 1.4;
      // 排氣
      for (let q = 0; q < 3; q++) { const u = ((tn / 1400) + q / 3 + i * 0.13) % 1; c.fillStyle = `rgba(200,200,210,${0.22 * (1 - u)})`; c.beginPath(); c.arc(cx - 150 * k - u * 70 * k, gy - 58 * k - u * 20 * k, (8 + u * 18) * k, 0, TAU); c.fill(); }
      GS.drawCar(c, cx, gy + jig, k, tm.c, { num: i + 1, rear: 'new', front: 'new' });
      T(tm.n, x + 26, y0 + 270, 40, '#fff', 'left', 900);
      T(`${tm.tb} 桌`, x + 26, y0 + 316, 24, '#a9a6b8', 'left', 700);
      const bp = lob.bump[i] ? Math.max(0, 1 - (tn - lob.bump[i]) / 600) : 0;
      c.save(); c.translate(x + cw - 64, y0 + 290); c.scale(1 + bp * 0.45, 1 + bp * 0.45);
      T(String(cnt[i]), 0, 0, 68, tm.c, 'right', 900, ORB); c.restore();
      T('人', x + cw - 26, y0 + 304, 28, '#cfc9dc', 'right', 700);
      if (bp > 0) { c.globalAlpha = bp; T('+1', x + cw - 90, y0 + 230 - (1 - bp) * 40, 40, GRN, 'center', 900, ORB); c.globalAlpha = 1; }
    });
  }

  /* ───── 主迴圈 ───── */
  let last = performance.now();
  function frame(tn) {
    const dt = Math.min(0.1, (tn - last) / 1000); last = tn;
    const st = game.status || 'lobby', s = game.stage == null ? -1 : game.stage, nowT = now(), t = (tn - statusAt) / 1000;
    c.drawImage(bg, 0, 0);
    if (st === 'lobby' || s < 0 && st !== 'final' && st !== 'podium') drawLobby(t);
    else if (st === 'final') { drawHeader(4); drawFinal(t); }
    else if (st === 'podium') drawPodium(t, dt);
    else {
      drawHeader(s, headerTimer(s, nowT));
      drawPit(s, st, nowT, dt);
      if (st === 'intro') drawIntro(s, t);
      if (st === 'play') { if (s < 3) drawCountdown(nowT); else drawLights(nowT); }
      if (st === 'result') drawResult(s, t);
    }
    drawFlash(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
